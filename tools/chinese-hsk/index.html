<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 分级词表</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>语</text></svg>">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/cards.css">
  <script>
    /* HSK 3.0 词表（全量 11105：1–6 级 + 7–9 级 / 免费示例 1011：1–3 级）
       ------------------------------------------------------------------
       首页 = 目录 + 列表（照搬 COCA 那套，本体也是这个骨架）：
         目录   按 100 词一页的页号网格。页号左脊 = 该页主等级（HSK 1–6 / 7–9），
                底色 = 学习状态（有未掌握 = 黄，全部掌握/未学 = 青）。112 页。
         列表   点页号**先开页签**，再点左侧页签才进入该页的 100 张词卡
                （两步与本体一致）；页签 × 弹结课确认框。
         搜索   顶栏搜索框（不用打声调，搜 "ai" 也能命中 "ài"）。
       词卡：汉字大字（点读 zh）/ 拼音 / 繁体 / 词性 / 英文释义（点读 en）/ Source 署名。

       ⚠️ 大卡组纪律：数据一次分块拉全（2000/块），但 DOM 任何时刻只渲染一页
         （目录只画页号、列表 100 张卡），绝不把 11105 张卡塞进 DOM。
       宿主 getPage 按 current_order（队列序）返回，工具按 item_order 排回原始序。 */
    window.DC_TOOL = {
      title: 'HSK 分级词表',
      voiceLang: 'zh-CN'
    };
  </script>
</head>
<body>
  <div class="layout-row">
    <aside class="sidebar">
      <div class="sidebar-content">
        <button id="sidebar-home-btn" class="sidebar-brand-btn active" data-tooltip="目录">
          <i class="fa-solid fa-dragon"></i>
          <span>DragonCard</span>
        </button>
        <div class="study-tabs" id="study-tabs-container"></div>
      </div>
    </aside>
    <div class="main-content">
      <div class="study-top-bar">
        <span id="study-deck-title" class="study-deck-title"></span>
        <span style="flex:1"></span>
        <button id="font-settings-btn" class="top-btn" data-tooltip="字号">
          <i class="fa-solid fa-font"></i>
        </button>
        <div class="control-group">
          <button class="top-btn voice-select-btn" data-tooltip="中文朗读音色">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <div class="voice-dropdown" style="display:none;">
            <div class="voice-dropdown-header">选择音色 · 中文</div>
            <div class="voice-list"></div>
          </div>
        </div>
        <button class="top-btn" id="scroll-top-btn" data-tooltip="回到顶部">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
        <button class="top-btn" id="scroll-bottom-btn" data-tooltip="到最底部">
          <i class="fa-solid fa-arrow-down"></i>
        </button>
        <button id="card-view-btn" class="top-btn" data-tooltip="单卡模式">
          <i class="fa-solid fa-grip"></i>
        </button>
        <div class="skin-toggle-wrap" id="skin-toggle-wrap">
          <button id="style-btn" class="top-btn" data-tooltip="皮肤">
            <i class="fa-solid fa-palette"></i>
          </button>
          <div class="skin-dropdown" id="style-dropdown" style="display:none;">
            <div class="skin-dropdown-header"><i class="fa-solid fa-palette"></i> <span>皮肤</span></div>
            <div class="skin-list" id="style-list"></div>
          </div>
        </div>
        <button id="refresh-stats" class="stats-text" data-tooltip="刷新">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>…</span>
        </button>
      </div>
      <div class="study-scroll" id="study-scroll">
        <div class="study-content" id="study-content">
          <div id="catalogue-view">
            <div class="cat-bar">
              <div class="cat-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="hk-search-input" type="text" placeholder="搜词语 / 拼音（不用声调）/ 繁体…" autocomplete="off">
                <button type="button" id="hk-search-clear" data-tooltip="清空" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="cat-legend" id="cat-legend"></div>
            </div>
            <div id="catalogue-grid"></div>
            <div id="catalogue-results" style="display:none;"></div>
          </div>
          <div id="study-pages-container"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="font-drawer" class="font-drawer" style="display:none;">
    <div class="setting-item">
      <label>字号</label>
      <div class="control">
        <button id="font-size-minus">&minus;</button>
        <span id="font-size-value" class="value">100%</span>
        <button id="font-size-plus">+</button>
      </div>
    </div>
    <button id="reset-fonts" class="reset-btn">复位</button>
  </div>

  <!-- 结课弹窗：点侧栏页签的 × 会弹它（与 COCA / 本体同款）。 -->
  <div id="finish-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="finish-hero">
        <div class="finish-badge"><i class="fa-solid fa-check"></i></div>
        <div class="finish-title">结束这一页？</div>
        <div id="finish-subtitle">看看这一页的进度</div>
      </div>
      <div class="finish-stats">
        <div class="finish-stat">
          <div id="finish-total" class="finish-stat-num">0</div>
          <div class="finish-stat-label">本页词数</div>
        </div>
        <div class="finish-stat">
          <div id="finish-marked" class="finish-stat-num unknown">0</div>
          <div class="finish-stat-label">未掌握</div>
        </div>
      </div>
      <div class="finish-actions">
        <button id="modal-finish-cancel">继续学习</button>
        <button id="modal-finish-confirm">结束</button>
      </div>
    </div>
  </div>

  <div id="global-tooltip" class="action-btn-tooltip"></div>
  <div id="toast" class="toast"></div>
  <script src="assets/app.js"></script>
</body>
</html>

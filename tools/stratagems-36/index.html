<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三十六计</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%239e3b2e'/><text x='50' y='54' font-size='64' text-anchor='middle' dominant-baseline='central' font-family='Georgia,serif' fill='%23f7efe0'>计</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/cards.css">
  <script>
    /* 三十六计：中英双语合成一份卡组（42 张 = 36 计 + 6 张套别总览）。
       顶栏有**两个**分段控件：
         #view-seg 概览 / 列表 —— 视图（方图 vs 卡片），标签跟着语言走，见 app.js 的 VIEWS
         #lang-seg 中文 / English —— 切的是**同一张卡的两种语言**，不是两个视图，
                    所以标记状态、计数、翻面状态都不受影响，只有文案跟着换。
       计卡是「正面（计名/拼音/原文）→ 翻面（释义/典故/现代应用）」两张脸；
       总览卡没有翻面。没有眼睛按钮：原文与拼音始终显示。
       没有单卡模式：概览的格子点开是**就地弹窗**，不是把卡片切一张出来。 */
    window.DC_TOOL = {
      title: '三十六计',
      voiceLang: 'zh',
      langs: [
        { id: 'zh', label: '中文', voice: 'zh-CN', sample: '瞒天过海' },
        { id: 'en', label: 'English', voice: 'en-US', sample: 'Cross the Sea Under Camouflage' }
      ]
    };
  </script>
</head>
<body>
  <div class="layout-row">
    <div class="main-content">
      <div class="study-top-bar">
        <div class="seg" id="view-seg"></div>
        <div class="seg" id="lang-seg"></div>
        <span id="study-deck-title" class="study-deck-title"></span>
        <span style="flex:1"></span>
        <button id="font-settings-btn" class="top-btn" data-tooltip="字号">
          <i class="fa-solid fa-font"></i>
        </button>
        <div class="control-group">
          <button class="top-btn voice-select-btn" data-tooltip="朗读音色">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <div class="voice-dropdown" style="display:none;">
            <div class="voice-dropdown-header">选择音色 · <span id="voice-lang-label">中文</span></div>
            <div class="voice-list"></div>
          </div>
        </div>
        <button class="top-btn" id="scroll-top-btn" data-tooltip="回到顶部">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
        <button class="top-btn" id="scroll-bottom-btn" data-tooltip="到最底部">
          <i class="fa-solid fa-arrow-down"></i>
        </button>
        <!-- 旧版的「单卡模式」按钮已删（用户 2026-09-29 拍板）：概览 + 弹窗覆盖了
             同样的需求，少一个顶栏按钮、少一套 .sc-* 版式。 -->
        <div class="skin-toggle-wrap" id="skin-toggle-wrap">
          <button id="style-btn" class="top-btn" data-tooltip="皮肤">
            <i class="fa-solid fa-palette"></i>
          </button>
          <div class="skin-dropdown" id="style-dropdown" style="display:none;">
            <div class="skin-dropdown-header"><i class="fa-solid fa-palette"></i> <span>皮肤</span></div>
            <div class="skin-list" id="style-list"></div>
          </div>
        </div>
        <button id="refresh-stats" class="stats-text" data-tooltip="刷新">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>0 / 0</span>
        </button>
      </div>
      <div class="study-scroll" id="study-scroll">
        <div class="study-content">
          <div id="study-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="font-drawer" class="font-drawer" style="display:none;">
    <div class="setting-item">
      <label>字号</label>
      <div class="control">
        <button id="font-size-minus">&minus;</button>
        <span id="font-size-value" class="value">100%</span>
        <button id="font-size-plus">+</button>
      </div>
    </div>
    <button id="reset-fonts" class="reset-btn">复位</button>
  </div>

  <!-- 点概览方图的格子 / 行首 → 就地弹窗看那张卡的完整卡面。卡面由 app.js::openStModal()
       注入，和「列表」视图里那张是同一个 renderCard，只多 .st-modal-root、关闭钮
       和右下角「在列表中查看」。
       方图是查阅面：看完关掉人就还在原处，位置感不丢。 -->
  <div class="st-modal-mask" id="st-modal" hidden>
    <div class="st-modal-box" id="st-modal-box" role="dialog" aria-modal="true"
         aria-label="卡片" tabindex="-1"></div>
  </div>

  <div id="global-tooltip" class="action-btn-tooltip"></div>
  <div id="toast" class="toast"></div>
  <script src="assets/app.js"></script>
</body>
</html>

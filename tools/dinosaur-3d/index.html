<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 恐龙</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🦖</text></svg>">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/cards.css">
  <!-- ⚠️ 工具页没有宿主的 import map：GLTFLoader 内部裸引用 'three'，
       必须在这里声明映射，动态 import 才能解析（three.js 纪律见 app.css 头注释） -->
  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three/three.module.js",
      "three/addons/": "/static/vendor/three/jsm/"
    }
  }
  </script>
  <script>
    /* 3D 恐龙（GLB 观赏）：
         · 每张卡一个舞台，全局只有一个 renderer —— 最可见的卡位认领 canvas，
           其余卡位显示占位（WebGL 上下文上限 ~16，绝不开第二个 context）
         · 拖拽旋转 / 滚轮缩放 / 双击复位，闲置 3 秒回到自动旋转
         · 🔊 读中文名 + 描述（zh）；点拉丁学名读学名（en）
       模型 URL 来自卡片数据 model 字段（/static/media/*.glb，宿主同源）。 */
    window.DC_TOOL = {
      title: '3D 恐龙',
      voiceLang: 'zh-CN'
    };
  </script>
</head>
<body>
  <div class="layout-row">
    <div class="main-content">
      <div class="study-top-bar">
        <span id="study-deck-title" class="study-deck-title"></span>
        <span style="flex:1"></span>
        <button id="font-settings-btn" class="top-btn" data-tooltip="字号">
          <i class="fa-solid fa-font"></i>
        </button>
        <div class="control-group">
          <button class="top-btn voice-select-btn" data-tooltip="中文朗读音色">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <div class="voice-dropdown" style="display:none;">
            <div class="voice-dropdown-header">选择音色 · 中文</div>
            <div class="voice-list"></div>
          </div>
        </div>
        <button class="top-btn" id="scroll-top-btn" data-tooltip="回到顶部">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
        <button class="top-btn" id="scroll-bottom-btn" data-tooltip="到最底部">
          <i class="fa-solid fa-arrow-down"></i>
        </button>
        <button id="card-view-btn" class="top-btn" data-tooltip="单卡模式">
          <i class="fa-solid fa-grip"></i>
        </button>
        <div class="skin-toggle-wrap" id="skin-toggle-wrap">
          <button id="style-btn" class="top-btn" data-tooltip="皮肤">
            <i class="fa-solid fa-palette"></i>
          </button>
          <div class="skin-dropdown" id="style-dropdown" style="display:none;">
            <div class="skin-dropdown-header"><i class="fa-solid fa-palette"></i> <span>皮肤</span></div>
            <div class="skin-list" id="style-list"></div>
          </div>
        </div>
        <button id="refresh-stats" class="stats-text" data-tooltip="刷新">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>0 / 0</span>
        </button>
      </div>
      <div class="study-scroll" id="study-scroll">
        <div class="study-content">
          <div id="study-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="font-drawer" class="font-drawer" style="display:none;">
    <div class="setting-item">
      <label>字号</label>
      <div class="control">
        <button id="font-size-minus">&minus;</button>
        <span id="font-size-value" class="value">100%</span>
        <button id="font-size-plus">+</button>
      </div>
    </div>
    <button id="reset-fonts" class="reset-btn">复位</button>
  </div>

  <div id="global-tooltip" class="action-btn-tooltip"></div>
  <div id="toast" class="toast"></div>
  <script src="assets/app.js"></script>
</body>
</html>

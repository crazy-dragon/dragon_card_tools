<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音标拼读</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/cards.css">
  <script>
    /* 音标与拼读合成一个工具：不分两个卡组、也不按 cardHtml/cardJs 模板渲染。
       卡片数据里的 kind 字段决定它属于哪一组（顶栏第二个分段控件切这组）。

       两个维度的控件各管一件事（顶栏最左两个 seg）：
         view 图 / 卡片  —— 图 = 一览面（音标表 / 拼读表，点格**就地弹窗**），卡片 = 逐张读
         kind 音标 / 拼读 —— 上面两种视图都按它分

       点格子为什么是弹窗而不是"跳到那张卡"：一览面是**查阅面**，跳卡片等于换页，
       看 5 个音就要来回切 5 次、表里的位置感全丢。弹窗关掉就回到原处，
       弹窗里的卡面就是列表里那一张（同一份数据血缘）。

       单卡模式已退役（有概览面之后它是纯冗余）。 */
    window.DC_TOOL = {
      title: '音标拼读',
      voiceLang: 'en',
      views: [
        { id: 'chart', label: '总览' },
        { id: 'card',  label: '卡片' }
      ],
      kinds: [
        { id: 'ipa', label: '音标', count: 48 },
        { id: 'ph', label: '拼读', count: 109 }
      ]
    };
  </script>
</head>
<body>
  <div class="layout-row">
    <div class="main-content">
      <div class="study-top-bar">
        <!-- 总览 / 卡片（视图） + 音标 / 拼读（这一组）两个分段控件 -->
        <div class="seg" id="view-seg"></div>
        <div class="seg" id="kind-seg"></div>
        <span id="study-deck-title" class="study-deck-title"></span>
        <span style="flex:1"></span>
        <!-- 眼睛：控制卡面上的英文（默认关掉 = 不显示英文） -->
        <button id="eye-btn" class="top-btn wide" data-tooltip="显示英文">
          <i class="fa-solid fa-eye-slash"></i><span>英文</span>
        </button>
        <button id="font-settings-btn" class="top-btn" data-tooltip="字号">
          <i class="fa-solid fa-font"></i>
        </button>
        <div class="control-group">
          <button class="top-btn voice-select-btn" data-tooltip="单词发音音色">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <div class="voice-dropdown" style="display:none;">
            <div class="voice-dropdown-header">选择音色 · Words</div>
            <div class="voice-list"></div>
          </div>
        </div>
        <button class="top-btn" id="scroll-top-btn" data-tooltip="回到顶部">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
        <button class="top-btn" id="scroll-bottom-btn" data-tooltip="到最底部">
          <i class="fa-solid fa-arrow-down"></i>
        </button>
        <div class="skin-toggle-wrap" id="skin-toggle-wrap">
          <button id="style-btn" class="top-btn" data-tooltip="皮肤">
            <i class="fa-solid fa-palette"></i>
          </button>
          <div class="skin-dropdown" id="style-dropdown" style="display:none;">
            <div class="skin-dropdown-header"><i class="fa-solid fa-palette"></i> <span>皮肤</span></div>
            <div class="skin-list" id="style-list"></div>
          </div>
        </div>
        <button id="refresh-stats" class="stats-text" data-tooltip="刷新">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>0 / 0</span>
        </button>
      </div>
      <div class="study-scroll" id="study-scroll">
        <div class="study-content">
          <div id="study-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="font-drawer" class="font-drawer" style="display:none;">
    <div class="setting-item">
      <label>字号</label>
      <div class="control">
        <button id="font-size-minus">&minus;</button>
        <span id="font-size-value" class="value">100%</span>
        <button id="font-size-plus">+</button>
      </div>
    </div>
    <button id="reset-fonts" class="reset-btn">复位</button>
  </div>

  <div id="global-tooltip" class="action-btn-tooltip"></div>
  <div id="toast" class="toast"></div>
  <script src="assets/app.js"></script>
</body>
</html>
